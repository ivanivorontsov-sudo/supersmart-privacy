name: Privacy catalog browser audit

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "scripts/**"
      - ".github/workflows/browser-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "*.html"
      - "scripts/**"
      - ".github/workflows/browser-audit.yml"

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Browser audit
        run: |
          set -Eeuo pipefail
          python -m http.server 8769 --bind 127.0.0.1 >/tmp/privacy-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8769/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/browser-audit.mjs
